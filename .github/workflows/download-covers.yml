name: Download Comic Covers

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: write

concurrency:
  group: download-covers
  cancel-in-progress: false

jobs:
  download-covers:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download covers
        run: |
          python download_covers.py

      - name: Save covers to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add static/covers/

          if git diff --cached --quiet; then
            echo "No new covers to commit."
          else
            git commit -m "Update downloaded comic covers"
            git push
          fi
